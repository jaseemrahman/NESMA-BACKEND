name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# never run two deploys at the same time
concurrency:
  group: nesma-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nesma
          POSTGRES_PASSWORD: nesma
          POSTGRES_DB: nesma
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nesma"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://nesma:nesma@localhost:5432/nesma
      ALLOWED_HOSTS: '*'
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      CACHE_URL: locmemcache://ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --noinput

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nit-admin.zakhf.com
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USERNAME" ] && [ -n "$SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy skipped - add HOST, USERNAME and SSH_KEY repository secrets to enable automatic deploys."
          fi

      - name: Validate SSH key
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::SSH_KEY is not a valid private key. Paste the whole PRIVATE key (pbcopy < ~/.ssh/nesma_deploy), including the BEGIN/END lines - not the .pub file."
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          # pin the server's host key (no trust-on-first-use)
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]')
          echo "$HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICMJOH+Rd7a6R+8FhpEO4WFa/N8tqQnZMu9aCgqM8uq7" > ~/.ssh/known_hosts

      - name: Deploy over SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        # the key is restricted on the server to run deploy/deploy.sh only
        run: |
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]')
          USERNAME=$(printf '%s' "$USERNAME" | tr -d '[:space:]')
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$USERNAME@$HOST"
