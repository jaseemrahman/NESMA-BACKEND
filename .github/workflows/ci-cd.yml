name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# never run two deploys at the same time
concurrency:
  group: nesma-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nesma
          POSTGRES_PASSWORD: nesma
          POSTGRES_DB: nesma
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nesma"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://nesma:nesma@localhost:5432/nesma
      ALLOWED_HOSTS: '*'
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      CACHE_URL: locmemcache://ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --noinput

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nit-admin.zakhf.com
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: bash /var/www/nesma/app/deploy/deploy.sh
