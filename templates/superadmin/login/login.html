{% load static %}
<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="{% static 'superadmin/assets/images/brand/nit-fav.png' %}" />
    <title>NIT Admin | Sign In</title>
    <!-- Fonts & icons served locally (no third-party round trips); critical files preloaded -->
    <link rel="preload" href="{% static 'superadmin/assets/fonts/jost-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{% static 'superadmin/assets/fonts/anek-latin-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{% static 'superadmin/assets/fontawesome/webfonts/fa-solid-900.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link href="{% static 'superadmin/assets/fonts/nit-fonts.css' %}" rel="stylesheet">
    <link href="{% static 'superadmin/assets/fontawesome/css/all.min.css' %}" rel="stylesheet">
    <link href="{% static 'superadmin/assets/css/nit-design.css' %}" rel="stylesheet" />
    <style>
        html, body { height: 100%; margin: 0; }
        body { overflow-x: hidden; }

        .login-split { display: flex; min-height: 100vh; }

        /* LEFT: full-bleed imagery with the site's gradient overlay */
        .login-visual {
            flex: 1.25;
            position: relative;
            overflow: hidden;
            background: var(--nit-navy-ink);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            color: #fff;
        }
        .login-visual__img {
            position: absolute; inset: 0;
            background: url("{% static 'superadmin/assets/images/brand/login-hero.jpg' %}") 72% center / cover no-repeat;
            animation: kenburns 24s ease-in-out infinite alternate;
        }
        .login-visual::after {
            content: ""; position: absolute; inset: 0;
            /* artwork is already deep blue: light scrim only, enough for white text */
            background: linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,0) 45%, rgba(0,0,0,.45));
        }
        .login-visual > *:not(.login-visual__img) { position: relative; z-index: 1; }
        .login-visual__logo { height: 34px; width: auto; align-self: flex-start; filter: brightness(0) invert(1); }
        .login-visual__eyebrow {
            font-size: 11px; font-weight: 500; letter-spacing: var(--tracking-widest);
            text-transform: uppercase; color: var(--nit-sky); margin-bottom: 18px;
        }
        .login-visual__title {
            font-weight: 200; font-size: clamp(36px, 3.4vw, 56px); line-height: 1.12;
            letter-spacing: var(--tracking-tight); margin: 0 0 10px; color: #fff;
        }
        /* one line, directly under the heading */
        .login-visual__lead {
            font-size: clamp(13px, 1.1vw, 17px); font-weight: 300; line-height: 1.5;
            color: rgba(255,255,255,.75); margin: 0; white-space: nowrap;
        }

        /* RIGHT: white form panel */
        .login-panel {
            flex: 1;
            max-width: 560px;
            display: flex; align-items: center; justify-content: center;
            padding: 48px;
            background: #fff;
        }
        .login-form { width: 100%; max-width: 380px; animation: fade-in .7s ease-in-out both; }
        .login-form__logo { height: 32px; width: auto; margin-bottom: 48px; }
        .login-form__eyebrow {
            font-size: 11px; font-weight: 500; letter-spacing: var(--tracking-widest);
            text-transform: uppercase; color: var(--nit-blue); margin-bottom: 12px;
        }
        .login-form__title {
            font-weight: 200 !important; font-size: 44px; line-height: 1.15;
            letter-spacing: var(--tracking-tight); color: var(--text-heading); margin: 0 0 10px;
        }
        .login-form__lead { font-size: 15px; font-weight: 300; color: var(--text-muted); margin: 0 0 36px; }

        .field { margin-bottom: 24px; }
        .field label {
            display: block; margin-bottom: 8px;
            font-size: 12px; font-weight: 500; letter-spacing: var(--tracking-wider);
            text-transform: uppercase; color: var(--text-secondary);
        }
        .field__control { position: relative; }
        .field input {
            width: 100%; box-sizing: border-box;
            height: 48px; padding: 0 44px 0 0;
            border: 0; border-bottom: 1px solid var(--gray-300);
            background: transparent; outline: none;
            font-family: var(--font-futura); font-size: 17px; font-weight: 400; color: var(--foreground);
            transition: border-color var(--dur-base) var(--ease-standard);
        }
        .field input::placeholder { color: var(--gray-400); font-weight: 300; }
        .field input:focus { border-bottom-color: var(--nit-blue); }
        .field__toggle {
            position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            width: 36px; height: 36px; border: 0; background: transparent;
            color: var(--text-subtle); cursor: pointer;
        }
        .field__toggle:hover { color: var(--nit-blue); }

        .login-alert {
            border-left: 3px solid #B91C1C; background: #FEF2F2;
            padding: 12px 14px; margin-bottom: 26px;
            font-size: 14px; color: #991B1B;
        }
        .login-alert p { margin: 0; }
        .login-submit { margin-top: 36px; }

        @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 991px) {
            .login-visual { display: none; }
            .login-panel { max-width: none; padding: 32px 24px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .login-visual__img, .login-form { animation: none; }
        }
    </style>
</head>

<body>
    <div class="login-split">

        <!-- Imagery -->
        <div class="login-visual" aria-hidden="true">
            <div class="login-visual__img"></div>
            <img class="login-visual__logo" src="{% static 'superadmin/assets/images/brand/nit-logo.svg' %}" alt="">
            <div>
                <h2 class="login-visual__title">Website Management Portal</h2>
                <p class="login-visual__lead">Manage the media centre, website enquiries and career applications.</p>
            </div>
        </div>

        <!-- Form -->
        <div class="login-panel">
            <div class="login-form">
                <img class="login-form__logo" src="{% static 'superadmin/assets/images/brand/nit-logo.svg' %}" alt="Nesma Infrastructure &amp; Technology">
                <div class="login-form__eyebrow">Admin Portal</div>
                <h1 class="login-form__title">Sign in</h1>
                <p class="login-form__lead">Use your admin email and password.</p>

                {% if messages %}
                <div class="login-alert" role="alert">
                    {% for message in messages %}<p>{{ message }}</p>{% endfor %}
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="field">
                        <label for="emailInput">Email address</label>
                        <div class="field__control">
                            <input type="email" name="email" id="emailInput" placeholder="name@company.com" autocomplete="username" required value="{{ email }}">
                        </div>
                    </div>
                    <div class="field">
                        <label for="passwordInput">Password</label>
                        <div class="field__control">
                            <input type="password" name="password" id="passwordInput" placeholder="Your password" autocomplete="current-password" required>
                            <button type="button" class="field__toggle" onclick="togglePwd()" aria-label="Show password">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="login-submit">
                        <button type="submit" class="nit-btn nit-btn--primary nit-btn--block">
                            <span class="nit-btn__label"><span class="nit-btn__text" data-text="Sign in">Sign in</span></span>
                            <span class="nit-btn__arrow">{% include "superadmin/layout/nit_arrow.html" %}</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function togglePwd() {
            var input = document.getElementById("passwordInput");
            var icon = document.getElementById("eyeIcon");
            var show = input.type === "password";
            input.type = show ? "text" : "password";
            icon.classList.toggle("fa-eye", !show);
            icon.classList.toggle("fa-eye-slash", show);
        }
    </script>
</body>

</html>
