{% load static %}
{% include "superadmin/layout/header.html" %}

<div class="main-content app-content mt-0">
    <div class="side-app">
        <div class="main-container container-fluid">

            <div class="page-header">
                <div>
                    <h1 class="page-title">{% if category.pk %}Edit Blog Category{% else %}Add Blog Category{% endif %}</h1>
                </div>
                <div>
                    <a href="{{ back_url }}" class="nit-btn nit-btn--secondary nit-btn--back"><span class="nit-btn__label"><span class="nit-btn__text" data-text="Back to List">Back to List</span></span><span class="nit-btn__arrow">{% include "superadmin/layout/nit_arrow.html" %}</span></a>
                </div>
            </div>

            <div class="row">
                <div class="col-12 col-md-6 mx-auto">
                    <div class="card">
                        <div class="card-body">
                            <form method="POST">
                                {% csrf_token %}
                                <input type="hidden" name="next" value="{{ back_url }}">

                                <div class="mb-3">
                                    <label class="form-label" style="font-weight:600;">Category Name (English) <span class="text-danger">*</span></label>
                                    <input type="text" name="name" class="form-control" placeholder="e.g. News, Article, Announcement" value="{{ category.name|default:'' }}" maxlength="150" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label d-flex justify-content-between" style="font-weight:600;"><span>Category Name (Arabic) <span class="text-danger">*</span></span><span class="ar-text">اسم التصنيف</span></label>
                                    <input type="text" name="name_ar" class="form-control ar-input" dir="rtl" placeholder="مثال: أخبار، مقالات، إعلانات" value="{{ category.name_ar|default:'' }}" maxlength="150" required>
                                    <small class="text-muted">Shown on the Arabic website.</small>
                                </div>

                                <div class="mt-4 text-end">
                                    <button type="submit" class="nit-btn nit-btn--primary"><span class="nit-btn__label"><span class="nit-btn__text" data-text="Save Category">Save Category</span></span><span class="nit-btn__arrow">{% include "superadmin/layout/nit_arrow.html" %}</span></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

{% include "superadmin/layout/footer.html" %}
