{% load static %}
    <!-- FOOTER SECTION -->
    <footer class="footer mt-auto py-3 bg-white text-center border-top">
        <div class="container-fluid d-flex align-items-center justify-content-center">
            <span class="crafted-by-text">
                &copy; {% now "Y" %} Nesma Infrastructure &amp; Technology
            </span>
        </div>
    </footer>

    <!-- BACK-TO-TOP -->
    <a href="#top" id="back-to-top"><i class="fa fa-angle-up"></i></a>

    <!-- GLOBAL TOAST CONTAINER -->
    <div class="global-toast-container">
        {% if messages %}
            {% for message in messages %}
                <div class="sa-toast toast-{% if message.tags %}{{ message.tags }}{% else %}info{% endif %}" id="toast-{{ forloop.counter }}">
                    <i class="fas {% if message.tags == 'error' %}fa-times-circle{% elif message.tags == 'success' %}fa-check-circle{% else %}fa-info-circle{% endif %}"></i>
                    <div class="sa-toast-content">
                        <p>{{ message }}</p>
                    </div>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- GLOBAL DELETE CONFIRMATION MODAL -->
    <div class="modal fade" id="globalDeleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content style-modal" style="border-radius:16px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title font-weight-bold" style="color:#0F172A;">Confirm Action</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-3 text-start">
                    <p class="mb-1" style="font-size:15px; color:#334155;">Are you sure you want to permanently delete this item?</p>
                    <strong id="globalDeleteTargetName" style="color:#0F172A; font-size:15px;"></strong>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="border-radius:10px;">Cancel</button>
                    <form method="post" action="#" id="globalDeleteForm" class="m-0">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="">
                        <button type="submit" class="btn btn-danger" style="border-radius:10px;">Confirm Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- GLOBAL LARGE IMAGE PREVIEW MODAL -->
    <div class="modal fade" id="globalImageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content style-modal" style="border-radius:16px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title font-weight-bold" style="color:#0F172A;">Image Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-3 text-center">
                    <img src="" id="globalImagePreview" class="img-fluid rounded-3" style="max-height:75vh; object-fit:contain;">
                </div>
            </div>
        </div>
    </div>

    <!-- GLOBAL DETAIL TEXT MODAL -->
    <div class="modal fade" id="globalDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content style-modal" style="border-radius:16px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title font-weight-bold" id="globalDetailTitle" style="color:#0F172A;">Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-3 text-start">
                    <div id="globalDetailContent" style="font-size:14px; color:#334155; line-height:1.6; white-space:pre-wrap; max-height:400px; overflow-y:auto;"></div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="border-radius:10px;">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JQUERY JS -->
    <script src="{% static 'superadmin/assets/js/jquery.min.js' %}"></script>

    <script>
        $(document).ready(function() {
            // Auto-hide messages
            $('.sa-toast').each(function(index) {
                var element = $(this);
                setTimeout(function() {
                    element.addClass('fade-out');
                    setTimeout(function() {
                        element.remove();
                    }, 500);
                }, 4000 + (index * 500));
            });
        });
    </script>

    <!-- BOOTSTRAP JS -->
    <script src="{% static 'superadmin/assets/plugins/bootstrap/js/popper.min.js' %}"></script>
    <script src="{% static 'superadmin/assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>

    <!-- SIDE-MENU JS-->
    <script src="{% static 'superadmin/assets/plugins/sidemenu/sidemenu.js' %}"></script>

    <!-- Sticky js -->
    <script src="{% static 'superadmin/assets/js/sticky.js' %}"></script>

    <!-- SIDEBAR JS -->
    <script src="{% static 'superadmin/assets/plugins/sidebar/sidebar.js' %}"></script>

    <!-- Perfect SCROLLBAR JS-->
    <script src="{% static 'superadmin/assets/plugins/p-scroll/perfect-scrollbar.js' %}"></script>
    <script src="{% static 'superadmin/assets/plugins/p-scroll/pscroll.js' %}"></script>

    <!-- CUSTOM JS -->
    <script src="{% static 'superadmin/assets/js/custom.js' %}"></script>

<script>
$(document).ready(function() {
    // Helper function for dynamic bottom-right sticky toast notification
    function showToast(message, type) {
        type = type || 'success';
        var iconClass = (type === 'success') ? 'fa-check-circle' : (type === 'error' ? 'fa-times-circle' : 'fa-info-circle');
        var toastHtml = '<div class="sa-toast toast-' + type + '">' +
                            '<i class="fas ' + iconClass + '"></i>' +
                            '<div class="sa-toast-content"><p>' + message + '</p></div>' +
                        '</div>';
        var $toast = $(toastHtml).appendTo('.global-toast-container');
        setTimeout(function() {
            $toast.addClass('fade-out');
            setTimeout(function() { $toast.remove(); }, 400);
        }, 3500);
    }

    // Global Status Toggle Switch Handler
    $(document).on('change', '.status-toggle-switch', function() {
        var checkbox = $(this);
        var modelName = checkbox.data('model');
        var objectId = checkbox.data('id');
        var isChecked = checkbox.is(':checked');

        $.ajax({
            url: "{% url 'superadmin:StatusToggle' %}",
            type: "POST",
            data: {
                'model_name': modelName,
                'id': objectId,
                'status': isChecked,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            success: function(response) {
                if(response.status === 'success') {
                    showToast('Status updated successfully!', 'success');
                    var statusFilter = $('.filter-form select[name="status"]').val();
                    if (statusFilter === 'active' || statusFilter === 'inactive') {
                        reloadAjaxList();
                    }
                }
            },
            error: function(err) {
                checkbox.prop('checked', !isChecked);
                showToast('Failed to update status.', 'error');
            }
        });
    });

    // Sequence Dropdown AJAX Handler
    $(document).on('change', '.sequence-select', function() {
        var select = $(this);
        var modelName = select.data('model');
        var objectId = select.data('id');
        var seqVal = select.val();

        $.ajax({
            url: "{% url 'superadmin:SequenceUpdate' %}",
            type: "POST",
            data: {
                'model_name': modelName,
                'id': objectId,
                'sequence': seqVal,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            success: function(response) {
                if(response.status === 'success') {
                    showToast('Sequence updated successfully!', 'success');
                    reloadAjaxList();
                }
            },
            error: function() {
                showToast('Failed to update sequence.', 'error');
            }
        });
    });

    // Global Delete Modal trigger (NO BLINKING)
    $(document).on('click', '.trigger-delete-modal', function() {
        var name = $(this).data('name') || '';
        var url = $(this).data('url') || '#';
        $('#globalDeleteTargetName').text('"' + name + '"');
        $('#globalDeleteForm').attr('action', url);
        // after deleting, come back to the same list page / filters
        $('#globalDeleteForm input[name="next"]').val($(this).data('next') || ($('#ajax-list').length ? currentListUrl() : ''));
        var deleteModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('globalDeleteModal'));
        deleteModal.show();
    });

    // Global Large Image Preview trigger
    $(document).on('click', '.preview-img-clickable', function() {
        var src = $(this).data('full') || $(this).attr('src');  // list thumbnails open the full image
        if (src) {
            $('#globalImagePreview').attr('src', src);
            var imgModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('globalImageModal'));
            imgModal.show();
        }
    });

    // Global Detail Text Modal trigger
    $(document).on('click', '.open-detail-modal', function() {
        var title = $(this).data('title') || 'Details';
        var content = $(this).data('content') || '';
        $('#globalDetailTitle').text(title);
        // Public form data is always rendered as plain text (prevents stored XSS)
        if ($(this).data('plain')) {
            $('#globalDetailContent').text(String(content));
        } else {
            $('#globalDetailContent').html(content);
        }
        var detailModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('globalDetailModal'));
        detailModal.show();
    });

    // Dynamic Filter Reset Button Highlight Script
    function checkFilterActive() {
        $('.filter-form').each(function() {
            var form = $(this);
            var isDirty = false;
            
            form.find('.filter-input').each(function() {
                if ($(this).val().trim() !== '') {
                    isDirty = true;
                }
            });
            
            form.find('.filter-select').each(function() {
                var val = $(this).val();
                if (val && val !== 'active' && val !== '') {
                    isDirty = true;
                }
            });
            
            var resetBtn = form.find('.btn-reset-filter');
            if (isDirty) {
                resetBtn.addClass('active-reset-btn');
            } else {
                resetBtn.removeClass('active-reset-btn');
            }
        });
    }

    // Custom Select Dropdown Widget Generator
    function initCustomSelects() {
        $('.filter-select, select.form-select:not(.sequence-select):not(.application-status-select)').each(function() {
            var $select = $(this);
            if ($select.data('custom-select-init')) {
                var $wrapper = $select.closest('.custom-select-wrapper');
                var selectedVal = $select.val();
                var selectedText = $select.find('option:selected').text();
                $wrapper.find('.trigger-text').text(selectedText);
                $wrapper.find('.custom-select-option').removeClass('selected');
                $wrapper.find('.custom-select-option[data-value="' + selectedVal + '"]').addClass('selected');
                return;
            }

            $select.data('custom-select-init', true).hide();

            var $wrapper = $('<div class="custom-select-wrapper"></div>');
            $select.after($wrapper);
            $wrapper.append($select);

            var selectedVal = $select.val();
            var selectedText = $select.find('option:selected').text() || 'SELECT';

            var $trigger = $('<div class="custom-select-trigger">' +
                                '<span class="trigger-text">' + selectedText + '</span>' +
                                '<i class="fas fa-chevron-down trigger-icon"></i>' +
                             '</div>');
            $wrapper.append($trigger);

            var $options = $('<div class="custom-select-options"></div>');
            $select.find('option').each(function() {
                var val = $(this).attr('value') !== undefined ? $(this).attr('value') : '';
                var text = $(this).text();
                var isSel = (String(val) === String(selectedVal));
                var $opt = $('<div class="custom-select-option ' + (isSel ? 'selected' : '') + '" data-value="' + val + '">' +
                                '<span>' + text + '</span>' +
                                '<i class="fas fa-check check-icon"></i>' +
                             '</div>');
                $options.append($opt);
            });
            $wrapper.append($options);

            $trigger.on('click', function(e) {
                e.stopPropagation();
                $('.custom-select-wrapper').not($wrapper).removeClass('open');
                $wrapper.toggleClass('open');
            });

            $options.on('click', '.custom-select-option', function(e) {
                e.stopPropagation();
                var val = $(this).data('value');
                var text = $(this).find('span').text();

                $options.find('.custom-select-option').removeClass('selected');
                $(this).addClass('selected');
                $trigger.find('.trigger-text').text(text);
                $wrapper.removeClass('open');

                if (String($select.val()) !== String(val)) {
                    $select.val(val).trigger('change');
                }
            });
        });
    }

    $(document).on('click', function() {
        $('.custom-select-wrapper').removeClass('open');
    });

    initCustomSelects();

    checkFilterActive();

    // ── AJAX list filtering ────────────────────────────────────────────────
    // Only the #ajax-list region (table + pagination + summary) is replaced with the
    // server's fresh HTML. Older in-flight requests are aborted so a slow response can
    // never overwrite a newer one, and caching is disabled so results are always current.
    var listXhr = null;
    var searchTimeout = null;

    // Current list URL (path + filters + page + rows per page), without jQuery's cache-buster
    function currentListUrl() {
        var params = new URLSearchParams(window.location.search);
        params.delete('_');
        var query = params.toString();
        return window.location.pathname + (query ? '?' + query : '');
    }
    window.currentListUrl = currentListUrl;

    // Filters changed -> back to page 1, but keep the chosen rows-per-page
    function listUrlFromForm() {
        var form = $('.filter-form').first();
        var params = new URLSearchParams(form.length ? form.serialize() : '');
        Array.from(params.keys()).forEach(function(key) { if (!params.get(key)) { params.delete(key); } });  // drop empty filters
        var perPage = new URLSearchParams(window.location.search).get('per_page');
        if (perPage) { params.set('per_page', perPage); }
        var query = params.toString();
        return window.location.pathname + (query ? '?' + query : '');
    }

    function loadAjaxList(url, pushHistory) {
        var $list = $('#ajax-list');
        if (!$list.length) { window.location.href = url; return; }
        if (listXhr) { listXhr.abort(); }
        clearTimeout(window.__listDimTimer);
        window.__listDimTimer = setTimeout(function() { $list.css('opacity', '0.55'); }, 150);
        listXhr = $.ajax({
            url: url,
            type: 'GET',
            cache: false,
            dataType: 'html',
            success: function(html) {
                var fresh = $(new DOMParser().parseFromString(html, 'text/html')).find('#ajax-list');
                if (!fresh.length) { window.location.href = url; return; }
                clearTimeout(window.__listDimTimer);
                $list.html(fresh.html()).css('opacity', '1');
                if (pushHistory) { window.history.pushState({ajaxList: true}, '', url); }
            },
            error: function(xhr, status) {
                if (status !== 'abort') { clearTimeout(window.__listDimTimer); $list.css('opacity', '1'); showToast('Could not load the list. Please try again.', 'error'); }
            }
        });
    }

    // Re-fetch the current page of the list with the current filters (after toggles, edits...)
    function reloadAjaxList() {
        loadAjaxList(window.location.pathname + window.location.search, false);
    }
    window.reloadAjaxList = reloadAjaxList;

    $(document).on('input', '.filter-input', function() {
        checkFilterActive();
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function() { loadAjaxList(listUrlFromForm(), true); }, 250);
    });

    $(document).on('change', '.filter-select', function() {
        checkFilterActive();
        loadAjaxList(listUrlFromForm(), true);
    });

    // Enter in the search box: filter via AJAX instead of a full page submit
    $(document).on('submit', '.filter-form', function(e) {
        e.preventDefault();
        clearTimeout(searchTimeout);
        loadAjaxList(listUrlFromForm(), true);
    });

    // Rows per page -> reload from page 1 with the same filters
    $(document).on('change', '#ajax-list .per-page-select', function() {
        var params = new URLSearchParams(window.location.search);
        params.delete('_');
        params.delete('page');
        params.set('per_page', $(this).val());
        loadAjaxList(window.location.pathname + '?' + params.toString(), true);
    });

    $(document).on('click', '#ajax-list .pagination a', function(e) {
        e.preventDefault();
        var href = $(this).attr('href');
        if (href && href !== '#') { loadAjaxList(window.location.pathname + href, true); }
    });

    // Back / forward buttons: reload the list for that URL
    window.addEventListener('popstate', function() {
        if ($('#ajax-list').length) { window.location.reload(); }
    });

    // Clickable rows open the detail page; the row's own controls keep their normal behaviour
    $(document).on('click', 'tr.row-link', function(e) {
        if ($(e.target).closest('a, button, input, select, label, textarea, .form-switch, .custom-select-wrapper, .preview-img-clickable, .open-detail-modal').length) {
            return;
        }
        var href = $(this).data('href');
        if (!href) { return; }
        href = withNext(href);
        if (e.ctrlKey || e.metaKey) { window.open(href, '_blank'); } else { window.location.href = href; }
    });

    // Edit links on list pages remember the list page / filters to return to after saving
    function withNext(href) {
        return href + (href.indexOf('?') === -1 ? '?' : '&') + 'next=' + encodeURIComponent(currentListUrl());
    }
    $(document).on('click', 'a.keep-place', function(e) {
        if (e.ctrlKey || e.metaKey || e.shiftKey) { return; }
        e.preventDefault();
        window.location.href = withNext($(this).attr('href'));
    });

    // Export links always use the filters currently on screen
    $(document).on('click', '.export-link', function(e) {
        e.preventDefault();
        var form = $('.filter-form').first();
        var query = form.length ? form.serialize() : '';
        window.location.href = $(this).attr('href').split('?')[0] + (query ? '?' + query : '');
    });
});

    // Image Upload Preview Handler
    $(document).on('change', '.file-upload-input', function(e) {
        var input = this;
        var wrap = $(this).closest('.image-upload-wrap');
        var previewContainer = wrap.find('.preview-container');
        var placeholderContainer = wrap.find('.placeholder-container');
        var previewImg = wrap.find('.img-preview');
        
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                previewImg.attr('src', e.target.result);
                previewContainer.show();
                placeholderContainer.hide();
            };
            reader.readAsDataURL(input.files[0]);
        }
    });
</script>

</body>

</html>
