# /etc/nginx/sites-available/nesma  - https://nit-admin.zakhf.com
# (certbot adds the 443/SSL block and the http->https redirect)
upstream nesma_app {
    server unix:/run/nesma/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name nit-admin.zakhf.com;

    client_max_body_size 15M;          # CV (5 MB) / blog images (10 MB)
    access_log /var/log/nginx/nesma.access.log;
    error_log  /var/log/nginx/nesma.error.log warn;

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # hashed static files (collectstatic) - cached for a year
    location /static/ {
        alias /var/www/nesma/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # uploaded blog images (public); CVs are NOT served here - only via the admin (login required)
    location /media/careers/ { return 404; }
    location /media/ {
        alias /var/www/nesma/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://nesma_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
